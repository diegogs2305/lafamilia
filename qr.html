<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de QR</title>
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        #resultado {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            word-wrap: break-word;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Lector de QR</h1>
    <div id="reader"></div>
    <p id="resultado">Aquí aparecerá el contenido del QR</p>

    <script>
        // Función para comprobar si es una URL
        function esURL(str) {
            try {
                new URL(str);
                return true;
            } catch {
                return false;
            }
        }

        // Detectar si es un dispositivo móvil
        function esMovil() {
            return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
        }

        // Elegir cámara según dispositivo
        const camara = esMovil() ? { facingMode: "environment" } : { facingMode: "user" };

        // Inicializar lector de QR
        const html5QrCode = new Html5Qrcode("reader");

        html5QrCode.start(
            camara,
            { fps: 10, qrbox: 250 },
            (decodedText, decodedResult) => {
                // Mostrar contenido del QR
                document.getElementById("resultado").innerText = decodedText;

                // Redirigir si es una URL
                if (esURL(decodedText)) {
                    window.location.href = decodedText;
                }
            },
            (errorMessage) => {
                console.log("Error leyendo QR: ", errorMessage);
            }
        ).catch((err) => {
            console.error("No se pudo iniciar la cámara: ", err);
        });
    </script>
</body>
</html>
