<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector de QR</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<style>
  body { font-family: Arial; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  video { width: 100%; max-width: 500px; border: 2px solid #333; border-radius: 10px; }
  canvas { display: none; }
  #resultado { margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>
<h1>Lector de QR</h1>
<video id="video" autoplay></video>
<canvas id="canvas"></canvas>
<p id="resultado">Aquí aparecerá el contenido del QR</p>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const context = canvas.getContext('2d');
const resultado = document.getElementById('resultado');

// Pedir acceso a la cámara
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
.then(stream => {
    video.srcObject = stream;
    video.setAttribute("playsinline", true); // necesario en iPhone
    requestAnimationFrame(tick);
})
.catch(err => {
    resultado.innerText = "Error al acceder a la cámara: " + err;
});

function tick() {
    if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
        if(code){
            resultado.innerText = code.data;
            if(/^https?:\/\//.test(code.data)){
                window.location.href = code.data;
            }
        }
    }
    requestAnimationFrame(tick);
}
</script>
</body>
</html>
