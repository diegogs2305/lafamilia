 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centro Principal</title>

  <!-- Fuente elegante -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #1e90ff;
      --bg: #f5f7fb;
      --card-bg: #fff;
      --text: #111;
      --radius: 16px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 1.2rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    header h1 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      margin: 0;
    }

    .logout-btn {
      background-color: var(--primary);
      border: none;
      color: white;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background-color: #006edc;
    }

    .grid-container {
      padding: 3rem 2rem;
      display: grid;
      gap: 2rem;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .grid-item {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .grid-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .grid-item svg {
      width: 48px;
      height: 48px;
      margin-bottom: 1rem;
      fill: #444;
    }

    .grid-item h2 {
      margin: 0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Bienvenido, Diego</h1>
    <button class="logout-btn" onclick="cerrarSesion()">Cerrar sesión</button>
  </header>

  <main class="grid-container">

    <div class="grid-item" onclick="location.href='juegos.html'">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17 6h-10c-2.21 0-4 1.79-4 4v4c0 2.21 1.79 4 4 4h1v2h2v-2h6v2h2v-2h1c2.21 0 4-1.79 4-4v-4c0-2.21-1.79-4-4-4zm-10 6c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm10 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
      <h2>Juegos</h2>
    </div>

    <div class="grid-item" onclick="location.href='chatbot.html'">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 2h-16c-1.1 0-2 .9-2 2v14l4-4h14c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm-2 6h-12v-2h12v2z"/></svg>
      <h2>Chatbot</h2>
    </div>

    <div class="grid-item" onclick="location.href='perfil.html'">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 12c2.7 0 5.3-2.1 5.3-5.3s-2.6-5.3-5.3-5.3-5.3 2.6-5.3 5.3 2.6 5.3 5.3 5.3zm0 1.3c-3.5 0-10.3 1.8-10.3 5.3v2.7h20.7v-2.7c0-3.5-6.8-5.3-10.3-5.3z"/></svg>
      <h2>Perfil</h2>
    </div>

    <div class="grid-item" onclick="location.href='contacto.html'">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 4h-16c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-12c0-1.1-.9-2-2-2zm0 4l-8 5-8-5v-2l8 5 8-5v2z"/></svg>
      <h2>Contacto</h2>
    </div>

  </main>

  <script>
    function cerrarSesion() {
      localStorage.removeItem("logueado");
      window.location.href = "login.html";
    }

    // Seguridad opcional: proteger el acceso
    if (!localStorage.getItem("logueado")) {
      window.location.href = "login.html";
    }
  </script>

</body>
</html>

 <script>
    if (!localStorage.getItem('userLoggedIn')) {
      window.location.href = 'pagina.html';
    }

    function logout() {
      localStorage.removeItem('userLoggedIn');
      window.location.href = 'pagina.html';
    }
  </script>
