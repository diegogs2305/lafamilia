<p id="descargar"></p>

<script>
  // Detectar sistema operativo
  const userAgent = navigator.userAgent || navigator.vendor || window.opera;

  let mensaje = "";
  if (/android/i.test(userAgent)) {
    mensaje = '<a href="https://play.google.com/store/apps/details?id=com.google.android.apps.docs.editors.sheets" target="_blank">Descarga la app desde Google Play</a>';
  } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
    mensaje = '<a href="https://apps.apple.com/app/google-sheets/id842849113" target="_blank">Descarga la app desde App Store</a>';
  } else {
    mensaje = 'Estás usando un ordenador o un sistema no compatible.';
  }

  document.getElementById("descargar").innerHTML = mensaje;
</script>
