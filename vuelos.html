<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA FAMILIA FLIGHTS - Selección de vuelos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
body { margin:0; font-family:Inter,sans-serif; background:white; color:#222; }
header { padding:20px; text-align:center; border-bottom:2px solid #eee; }
h1 { margin:0; font-size:28px; font-weight:800; color:#cc0000; }
.app { max-width:1200px; margin:auto; padding:20px; }
.panel { background:#f6f6f6; padding:16px; border-radius:10px; margin-bottom:20px; border:1px solid #ddd; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
select,input,button { padding:10px; border-radius:8px; border:1px solid #bbb; width:100%; font-size:15px; }
button { background:#cc0000; color:white; border:none; cursor:pointer; font-weight:700; }
button:hover { background:#a00000; }
.flight-card { background:#ffffff; border:1px solid #ddd; padding:14px; border-radius:12px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
.flight-card:hover { background:#fafafa; }
.price { font-weight:800; color:#cc0000; font-size:18px; }
.seat { width:30px; height:30px; border:1px solid #888; margin:2px; display:inline-block; text-align:center; line-height:30px; cursor:pointer; border-radius:4px; }
.seat.taken { background:#999; cursor:not-allowed; color:#fff; }
.seat.selected { background:#cc0000; color:white; }
.seat-row { margin-bottom:5px; }
</style>
</head>
<body>

<header>
  <h1>LA FAMILIA FLIGHTS</h1>
</header>

<div class="app">
  <div class="panel">
    <h2>Reserva tu vuelo</h2>
    <div class="grid">
      <div>
        <label>Origen</label>
        <select id="origin"></select>
      </div>
      <div>
        <label>Destino</label>
        <select id="destination"></select>
      </div>
      <div>
        <label>Fecha de ida</label>
        <input type="date" id="dateGo">
      </div>
      <div>
        <label>Fecha de vuelta</label>
        <input type="date" id="dateReturn">
      </div>
      <div>
        <label>Adultos</label>
        <select id="adults"><option>1</option><option>2</option><option>3</option><option>4</option></select>
      </div>
      <div>
        <label>Niños</label>
        <select id="kids"><option>0</option><option>1</option><option>2</option><option>3</option></select>
      </div>
      <div>
        <label>Clase</label>
        <select id="class"><option value="eco">Turista</option><option value="premium">Premium</option><option value="business">Business</option></select>
      </div>
    </div>
    <button style="margin-top:10px;" onclick="searchOutbound()">Buscar vuelos de ida</button>
  </div>

  <div class="panel" id="resultsGo" style="display:none;">
    <h2>Vuelos de ida</h2>
    <div id="flightListGo"></div>
  </div>

  <div class="panel" id="resultsReturn" style="display:none;">
    <h2>Vuelos de vuelta</h2>
    <div id="flightListReturn"></div>
  </div>

  <div class="panel" id="seatsPanel" style="display:none;">
    <h2>Selecciona tus asientos</h2>
    <div id="seatMap"></div>
    <button onclick="nextPassengerData()">Siguiente</button>
  </div>
</div>

<script>
// Lista de 100 aeropuertos reales (nombre, ciudad, IATA, lat/lng)
const airports=[
{code:"MAD",name:"Madrid-Barajas",city:"Madrid",lat:40.4983,lng:-3.5676},
{code:"BCN",name:"Barcelona-El Prat",city:"Barcelona",lat:41.2974,lng:2.0833},
{code:"LHR",name:"Heathrow",city:"Londres",lat:51.4700,lng:-0.4543},
{code:"CDG",name:"Charles de Gaulle",city:"París",lat:49.0097,lng:2.5479},
{code:"JFK",name:"John F. Kennedy",city:"Nueva York",lat:40.6413,lng:-73.7781},
{code:"NRT",name:"Narita",city:"Tokio",lat:35.7767,lng:140.3186},
{code:"SYD",name:"Kingsford Smith",city:"Sídney",lat:-33.9399,lng:151.1753},
{code:"DXB",name:"Dubai Intl",city:"Dubái",lat:25.2532,lng:55.3657},
{code:"FRA",name:"Frankfurt",city:"Frankfurt",lat:50.0379,lng:8.5622},
{code:"ZRH",name:"Zurich",city:"Zúrich",lat:47.4581,lng:8.5492},
// ... añadir los demás hasta 100 aeropuertos
];

// Llenar select con aeropuertos
const originSelect=document.getElementById("origin");
const destSelect=document.getElementById("destination");
airports.forEach(a=>{
  const opt=document.createElement("option");
  opt.value=a.code;
  opt.textContent=`${a.name} (${a.city}) - ${a.code}`;
  originSelect.appendChild(opt.cloneNode(true));
  destSelect.appendChild(opt.cloneNode(true));
});

// Variables globales
let selectedOutbound, selectedReturn;

// Haversine para distancia km
function distanceHav(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

function calcDuration(dist){ return Math.ceil(dist/850 + 0.5); } // +30 min taxi
function calcPrice(dist,clase,adults,kids){ 
  let base=0.12*dist;
  if(clase==="premium") base*=1.5;
  if(clase==="business") base*=2.5;
  return Math.round(base*adults + base*0.5*kids);
}

function generateFlights(from,to,clase){
  const aFrom=airports.find(a=>a.code===from);
  const aTo=airports.find(a=>a.code===to);
  const dist=distanceHav(aFrom.lat,aFrom.lng,aTo.lat,aTo.lng);
  const adults=parseInt(document.getElementById("adults").value);
  const kids=parseInt(document.getElementById("kids").value);
  const duration=calcDuration(dist);
  const list=[];
  for(let i=0;i<3;i++){
    const hour=6+Math.floor(Math.random()*16);
    list.push({
      id:"FL"+Math.floor(Math.random()*999999),
      from,to,
      time:`${hour}:00`,
      duration:duration+"h",
      aircraft:dist<2000?"Airbus A320":(dist<5000?"Airbus A321":"Airbus A330"),
      price:calcPrice(dist,clase,adults,kids)
    });
  }
  return list;
}

function searchOutbound(){
  const o=originSelect.value;
  const d=destSelect.value;
  const clase=document.getElementById("class").value;
  if(o===d){ alert("Origen y destino no pueden ser iguales."); return; }
  const flights=generateFlights(o,d,clase);
  document.getElementById("resultsGo").style.display="block";
  const cont=document.getElementById("flightListGo");
  cont.innerHTML="";
  flights.forEach(f=>{
    const card=document.createElement("div");
    card.className="flight-card";
    card.innerHTML=`<div><strong>${f.from} → ${f.to}</strong><br>${f.time} — ${f.duration}<br>Avión: ${f.aircraft}</div><div class="price">${f.price}€</div><button onclick='chooseOutbound("${f.id}")'>Elegir</button>`;
    cont.appendChild(card);
  });
}

function chooseOutbound(id){
  selectedOutbound=id;
  document.getElementById("resultsReturn").style.display="block";
  const o=originSelect.value;
  const d=destSelect.value;
  const clase=document.getElementById("class").value;
  const flights=generateFlights(d,o,clase);
  const cont=document.getElementById("flightListReturn");
  cont.innerHTML="";
  flights.forEach(f=>{
    const card=document.createElement("div");
    card.className="flight-card";
    card.innerHTML=`<div><strong>${f.from} → ${f.to}</strong><br>${f.time} — ${f.duration}<br>Avión: ${f.aircraft}</div><div class="price">${f.price}€</div><button onclick='chooseReturn("${f.id}")'>Elegir vuelta</button>`;
    cont.appendChild(card);
  });
}

function chooseReturn(id){
  selectedReturn=id;
  document.getElementById("seatsPanel").style.display="block";
  generateSeatMap();
}

function generateSeatMap(){
  const seatMap=document.getElementById("seatMap");
  seatMap.innerHTML="";
  let rows=10, cols=6;
  const clase=document.getElementById("class").value;
  if(clase==="business"){ rows=3; cols=4; }
  else if(clase==="premium"){ rows=5; cols=6; }
  for(let r=1;r<=rows;r++){
    const rowDiv=document.createElement("div"); rowDiv.className="seat-row";
    for(let c=1;c<=cols;c++){
      const seat=document.createElement("div");
      seat.className="seat";
      seat.textContent=`${r}${String.fromCharCode(64+c)}`;
      if(Math.random()<0.3) seat.classList.add("taken");
      seat.onclick=function(){ if(!seat.classList.contains("taken")) seat.classList.toggle("selected"); };
      rowDiv.appendChild(seat);
    }
    seatMap.appendChild(rowDiv);
  }
}

function nextPassengerData(){
  const selected=document.querySelectorAll(".seat.selected");
  if(selected.length===0){ alert("Selecciona al menos un asiento"); return; }
  const data={
    vueloIdida:selectedOutbound,
    vueloVuelta:selectedReturn,
    origen:originSelect.value,
    destino:destSelect.value,
    fechaIda:document.getElementById("dateGo").value,
    fechaVuelta:document.getElementById("dateReturn").value,
    clase:document.getElementById("class").value,
    pasajeros:Array.from(selected).map(s=>({seat:s.textContent}))
  };
  localStorage.setItem("reserva",JSON.stringify(data));
  window.location.href="pago.html";
}
</script>

</body>
</html>
