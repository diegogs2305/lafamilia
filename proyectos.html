<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="orientacion.css" />
  <style>
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    body {
      background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      color: white;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 50px 20px;
      text-align: center;
      animation: fadeSlide 1.2s ease-out;
    }
<button id="btnHome" style="
  position: fixed;
  top: 20px;
  right: 20px;
  background-color: #ff4b2b;
  border: none;
  color: white;
  padding: 10px 16px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(255,75,43,0.6);
  transition: background-color 0.3s ease;
  z-index: 1000;
">
  🏠 Inicio
</button>

<script>
  const btn = document.getElementById('btnHome');
  btn.onclick = () => {
    window.location.href = 'index'; // Ajusta la ruta de inicio aquí
  };
  btn.addEventListener('mouseover', () => btn.style.backgroundColor = '#ff3a1a');
  btn.addEventListener('mouseout', () => btn.style.backgroundColor = '#ff4b2b');
</script>

    h1 {
