<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💼📊 Centro de Proyectos💻</title>
  <link rel="stylesheet" href="orientacion.css" />
  <style>
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    body {
      background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      color: white;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 50px 20px;
      text-align: center;
      animation: fadeSlide 1.2s ease-out;
    }
<button id="btnHome" style="
  position: fixed;
  top: 20px;
  right: 20px;
  background-color: #ff4b2b;
  border: none;
  color: white;
  padding: 10px 16px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(255,75,43,0.6);
  transition: background-color 0.3s ease;
  z-index: 1000;
">
  🏠 Inicio
</button>

<script>
  const btn = document.getElementById('btnHome');
  btn.onclick = () => {
    window.location.href = 'index.html'; // Ajusta la ruta de inicio aquí
  };
  btn.addEventListener('mouseover', () => btn.style.backgroundColor = '#ff3a1a');
  btn.addEventListener('mouseout', () => btn.style.backgroundColor = '#ff4b2b');
</script>

    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;
      animation: fadeSlide 1s ease-out;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 2em;
      animation: fadeSlide 1.4s ease-out;
    }

    button {
      background: #ff4b2b;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 1em;
      font-weight: bold;
      color: white;
      cursor: pointer;
      margin-bottom: 30px;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #ff3a1a;
    }
  </style>
  <script>
    // Verificar sesión para proteger la página
    function verificarAcceso() {
      const isLoggedIn = localStorage.getItem('userLoggedIn');
      const storedUser = localStorage.getItem('user2');
      if (!isLoggedIn || !storedUser) {
        window.location.href = 'inicio_proyectos.html'; // Redirige al login
      }
    }

    window.onload = verificarAcceso;

    // Cerrar sesión con alert y redirección correcta
    function logout() {
      localStorage.removeItem('userLoggedIn');
      localStorage.removeItem('user2');
      window.location.href = 'pagina.html';
    }
  </script>
</head>
<body>
  <h1>💼📊 Centro de Proyectos💻</h1>
  <p>Explora, piensa y ¡Aprende!</p>

  <button onclick="logout()">Cerrar sesión</button>

  <div style="position: relative; width: 100%; height: 0; padding-top: 56.25%;
    padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
    border-radius: 8px; will-change: transform;">
    <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0; margin: 0;"
      src="https://www.canva.com/design/DAGoqUFJzcQ/Ylw6dQTf8ptXpE6C9BGx1w/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
    </iframe>
  </div>
  <a href="https://www.canva.com/design/DAGoqUFJzcQ/Ylw6dQTf8ptXpE6C9BGx1w/view?utm_content=DAGoqUFJzcQ&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">Cristóbal Colón </a> de Diego GS  

  <p>Hecho con estilo y creatividad por Diego G.S ✨</p>
</body>
</html>
