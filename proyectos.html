<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💼📊 Centro de Proyectos💻</title>
  <link rel="stylesheet" href="orientacion.css" />
  <style>
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    body {
      background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      color: white;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 50px 20px;
      text-align: center;
      animation: fadeSlide 1.2s ease-out;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;
      animation: fadeSlide 1s ease-out;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 2em;
      animation: fadeSlide 1.4s ease-out;
    }

    .game-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .card {
      background: linear-gradient(145deg, #2e2e2e, #1c1c1c);
      border-radius: 20px;
      padding: 25px;
      width: 250px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      animation: fadeSlide 1.6s ease-out forwards;
      opacity: 0;
      card:hover {
      transform: scale(1.07);
      box-shadow: 0 10px 30px rgba(255, 75, 43, 0.6);
    }

    .card h2 {
      font-size: 1.5em;
      margin-bottom: 15px;
    }

    .card a {
      display: inline-block;
      background: #ff4b2b;
      padding: 10px 20px;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .card a:hover {
      background: #ff3a1a;
    }

    .footer {
      margin-top: 60px;
      font-size: 0.9em;
      color: #bbb;
      animation: fadeSlide 2s ease-out;
    }

    .game-icon {
      font-size: 4em;
      margin-bottom: 15px;
      color: #ff4b2b;
    }
    }
     button {
      background: #ff4b2b;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 1em;
      font-weight: bold;
      color: white;
      cursor: pointer;
      margin-bottom: 30px;
    }

    button:hover {
      background: #ff3a1a;
    }
  </style>
  <script>
    // Verificamos si hay sesión iniciada para 'user2'
    const isLoggedIn = localStorage.getItem('userLoggedIn');
    const storedUser = localStorage.getItem('user');

    if (!isLoggedIn || !storedUser) {
      window.location.href = 'pagina.html';
    }

    function logout() {
      localStorage.removeItem('userLoggedIn');
      window.location.href = 'pagina.html';
    }
  </script>
</head>
<body>
  <h1>💼📊 Centro de Proyectos💻</h1>
  <p>Explora, piensa y ¡Aprende!</p>

  <button onclick="logout()">Cerrar sesión</button>
