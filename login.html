<!DOCTYPE html>
<html lang="es">
<head>
  <title>🔐 BIENVENIDO AL INICIO DE SESIÓN PARA ACCEDER AL CENTRO DE JUEGOS 🎮 Y DE IA 🖥️ DE DIEGO G.S</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }
    .login-box {
      background: rgba(255,255,255,0.9);
      padding: 40px 60px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 2em;
      color: #ff7e5f;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
    }
    input:focus {
      outline: none;
      border-color: #ff7e5f;
    }
    .password-container {
      position: relative;
    }
    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.2em;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #ff7e5f;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #eb5a3c;
    }
    .switch {
      margin-top: 20px;
      font-size: 0.9em;
    }
    .switch a {
      color: #ff7e5f;
      text-decoration: none;
    }
    .switch a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🔐 BIENVENIDO AL INICIO DE SESIÓN PARA ACCEDER AL CENTRO DE JUEGOS 🎮 Y DE IA 🖥️ DE DIEGO G.S</h1>
    
    <input type="text" id="username" placeholder="👤 Usuario" />
    
    <div class="password-container">
      <input type="password" id="password" placeholder="🔒 Contraseña" />
      <span class="toggle-eye" onclick="togglePassword('password', this)">👁️</span>
    </div>
    
    <button onclick="login()">🔑 Entrar</button>
    
    <div class="switch">
      ¿No tienes cuenta? <a href="register.html">📝 Regístrate</a>
    </div>
  </div>

  <script>
    function togglePassword(id, eyeIcon) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.textContent = '🙈';
      } else {
        input.type = 'password';
        eyeIcon.textContent = '👁️';
      }
    }
  </script>
  <script src="auth.js"></script>
</body>
</html>
