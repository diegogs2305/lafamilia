<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>🖊️BIENVENIDO AL REGISTRO PARA DISFRUTAR LOS PROYECTOS 💼📊 DE DIEGO G.S</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }
    .register-box {
      background: rgba(0,0,0,0.6);
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      text-align: center;
      width: 320px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 2em;
      color: #43cea2;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #555;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1em;
    }
    input:focus {
      outline: none;
      border-color: #43cea2;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #43cea2;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #37b88b;
    }
    .switch {
      margin-top: 20px;
      font-size: 0.9em;
    }
    .switch a {
      color: #43cea2;
      text-decoration: none;
    }
    .switch a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-box">
    <h1>🖊️ BIENVENIDO AL REGISTRO PARA DISFRUTAR LOS PROYECTOS 💼📊 DE DIEGO G.S</h1>
    <input type="password" id="password" placeholder="🔒 Contraseña" />
    <input type="password" id="confirmPassword" placeholder="🔒 Repite contraseña" />
    <button type="button" onclick="register()">🚀 Registrarme</button>
    <div class="switch">
      ¿Ya tienes cuenta? <a href="inicio_proyectos.html">🔐 Iniciar sesión</a>
    </div>
  </div>
  <script src="proyecto.js"></script>
</body>
</html>
