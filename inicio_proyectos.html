<!DOCTYPE html>
<html lang="es">
<head>
  <title>🔐 BIENVENIDO A LA ZONA DE PROYECTOS DE DIEGO G.S</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #fbd72b, #f6871f, #f9484a);
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }
    .login-box {
      background: rgba(255,255,255,0.9);
      padding: 40px 60px;
      border-radius: 1px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.8em;
      color: #ff7e5f;
    }
    .password-container {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 40px 12px 12px; /* espacio para el ojo */
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #ff7e5f;
    }
    #togglePassword {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 20px;
      color: #ff7e5f;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #ff7e5f;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #eb5a3c;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🔐 BIENVENIDO AL INICIO DE SESIÓN PARA ACCEDER A LA ZONA DE PROYECTOS DE DIEGO G.S</h1>
    
    <div class="password-container">
      <input type="password" id="password" placeholder="🔒 Contraseña" />
      <span id="togglePassword">👁️</span>
    </div>
    
    <button onclick="login()">🔑 Entrar</button>
  </div>

  <script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
    });

    function login() {
      const password = passwordInput.value;
      // Aquí pones la contraseña que quieras para validar, por ejemplo "diego123"
      if (password === 'diego123') {
        alert('¡Acceso concedido!');
        // Redirige a la página de proyectos o lo que quieras
        window.location.href = 'zona_de_proyectos.html';
      } else {
        alert('Contraseña incorrecta, intenta de nuevo.');
      }
    }
  </script>
</body>
</html>
