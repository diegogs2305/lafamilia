<!DOCTYPE html>
<html lang="es">
<head>
  <title> 🔐BIENVENIDO A LA ZONA DE PROYECTOS DE DIEGO G.S  </title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <meta charset="UTF-8">
 
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #fbd72b, #f6871f, #f9484a);
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }
    .login-box {
      background: rgba(255,255,255,0.9);
      padding: 40px 60px;
      border-radius: 1px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 2em;
      color: #ff7e5f;
    }
    h2 {
      margin-bottom: 600px;
      font-size: 2em;
      color: #ff7e5f;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
    }
    input:focus {
      outline: none;
      border-color: #ff7e5f;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #ff7e5f;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #eb5a3c;
    }
    .switch {
      margin-top: 20px;
      font-size: 0.9em;
    }
    .switch a {
      color: #ff7e5f;
      text-decoration: none;
    }
    .switch a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  
  <div class="login-box">
    <h1>🔐BIENVENIDO AL INICO DE SESIÓN PARA ACCEDER A LA ZONA DE PROYECTOS DE DIEGO G.S </h1>
    <input type="password" id="password"     placeholder="🔒 Contraseña" />
    <button onclick="login()">🔑 Entrar</button>
    <div class="switch">
    </div>
  </div>
  <script src="proyecto.js"></script>
</body>
</html>
