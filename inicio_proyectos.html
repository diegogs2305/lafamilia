<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🔐 Inicio de Sesión</title>
  <style>
    body {
      background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1c1c1c;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255,75,43,0.7);
      width: 320px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #ff4b2b;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }
    button {
      background: #ff4b2b;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #ff3a1a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Iniciar Sesión</h2>
    <input type="password" id="password" placeholder="Contraseña" />
    <button onclick="login()">Entrar</button>
  </div>

  <script>
    function login() {
      const password = document.getElementById('password').value.trim();

      if (!password) {
        alert("Por favor, ingresa la contraseña.");
        return;
      }

      if (password === "Diego") {
        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('user2', JSON.stringify({ password: "Diego", invitado: true }));
        window.location.href = 'proyectos.html';
        return;
      }

      const storedUser = JSON.parse(localStorage.getItem('user2'));

      if (storedUser && storedUser.password === password) {
        localStorage.setItem('userLoggedIn', 'true');
        window.location.href = 'proyectos.html';
      } else {
        alert("Contraseña incorrecta o usuario no registrado.");
      }
    }
  </script>
</body>
</html>
